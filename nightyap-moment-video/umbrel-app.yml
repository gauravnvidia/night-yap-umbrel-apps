description: >-
  Renders a Night Yap listener's own heckle answer as an MP4 (the comic on stage, the voice, the
  crowd's laugh) for the app's Me, Your moments, "Download video".


  It holds no secrets and stores nothing but a week-long cache of finished clips. It renders one
  video at a time at low CPU priority, so other apps on this Umbrel (Kokoro) always come first. The
  app reaches it at https://video.nativ-elements.in through the Cloudflare Tunnel app.
