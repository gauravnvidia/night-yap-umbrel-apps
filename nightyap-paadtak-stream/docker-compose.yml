version: "3.7"

services:
  # No web page and no app_proxy: the app only sends a stream out to YouTube. The stream key is set by
  # the owner in the app's settings (Advanced, Environment variables, YOUTUBE_STREAM_KEY; declared in
  # umbrel-app.yml) and is never in this file. Without it the container idles.
  web:
    image: ghcr.io/gauravnvidia/paadtak-streamer:sha-b640d5d@sha256:9c3d265ec7b93053165f502a993dc778ec1b363cda385c02361b94719f755e8c
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    shm_size: 512m
    environment:
      STREAM_URL: https://paadtak.com/?stream
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # Normal priority (owner, 2026-10-21): a normal CPU weight, and Chromium and ffmpeg run at normal
    # priority inside, so the live stream gets its fair share next to Night Yap and Kokoro. Low priority
    # (cpu_shares 128 and nice 10, 1.0.0-1.0.4) made the sound crackle whenever Kokoro voiced segments.
    # cpus still caps the stream at four of the 8 threads, so it can never take the whole machine.
    cpu_shares: 1024
    cpus: 4.0
    mem_limit: 1200m
    memswap_limit: 1200m
