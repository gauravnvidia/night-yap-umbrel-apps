version: "3.7"

services:
  # No web page and no app_proxy: the app only sends a stream out to YouTube. The stream key is set by
  # the owner in the app's settings (Advanced, Environment variables, YOUTUBE_STREAM_KEY; declared in
  # umbrel-app.yml) and is never in this file. Without it the container idles.
  web:
    image: ghcr.io/gauravnvidia/paadtak-streamer:sha-8cbf829@sha256:456dd635e55ea65d05b64d2537ea773d1768b1f985625600c52f302b2f6f41dc
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    shm_size: 512m
    environment:
      STREAM_URL: https://paadtak.com/?stream
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # low priority: Night Yap's apps and Kokoro always win the CPU. cpu_shares 128 is an eighth of a
    # normal container's weight and Chromium and ffmpeg run at nice 10 inside, so when the CPU is full
    # the others come first. cpus caps it at four of the 8 threads: the cap of two (until 1.0.4) was hit
    # while Kokoro voiced segments (the machine runs slower then), and the stream's sound crackled
    # (2026-10-21). The cap only limits the stream; it never takes CPU from the others.
    cpu_shares: 128
    cpus: 4.0
    mem_limit: 1200m
    memswap_limit: 1200m
