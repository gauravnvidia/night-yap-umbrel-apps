version: "3.7"

services:
  # No web page and no app_proxy: the app only sends a stream out to YouTube. The stream key is set by
  # the owner in the app's settings (Advanced, Environment variables, YOUTUBE_STREAM_KEY; declared in
  # umbrel-app.yml) and is never in this file. Without it the container idles.
  web:
    image: ghcr.io/gauravnvidia/paadtak-streamer:sha-8cbf829@sha256:456dd635e55ea65d05b64d2537ea773d1768b1f985625600c52f302b2f6f41dc
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 15s
    shm_size: 512m
    environment:
      STREAM_URL: https://paadtak.com/?stream
    volumes:
      - ${APP_DATA_DIR}/data:/data
    # Normal priority (owner, 2026-10-21): no cpu_shares, so the container gets Docker's default CPU
    # weight, the same as Night Yap's apps and Kokoro. Low priority (cpu_shares 128, 1.0.0-1.0.4) made
    # the sound crackle whenever Kokoro voiced segments. (An explicit cpu_shares 1024 is avoided: on
    # cgroup v2 some Docker versions turn it into a weight below the default.) The nice 10 inside this
    # image only orders the container's own processes, not it against other apps. cpus still caps the
    # stream at four of the 8 threads, so it can never take the whole machine.
    cpus: 4.0
    mem_limit: 1200m
    memswap_limit: 1200m
