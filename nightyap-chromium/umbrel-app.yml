manifestVersion: 1
id: nightyap-chromium
name: Chromium
tagline: Chromium on your Umbrel, downloads straight to Files
icon: https://getumbrel.github.io/umbrel-apps-gallery/chromium/icon.svg
category: networking
version: "2dba585f"
port: 3452
description: >-
  Chromium running on this Umbrel, used from any browser on your network. Everything you download
  goes straight to Files, Downloads on the Umbrel.


  Opening the app sends you to Chromium's own secure address, https://umbrel.local:3454 (or the Umbrel's
  IP address with :3454). The first time, your browser warns about the certificate, because it is the
  Umbrel's own and not from a public authority; choose to continue. Then sign in with the username
  and password shown in this app's info. Bookmark the https address to go there directly.
developer: The Chromium Project
website: https://www.chromium.org/
submitter: Night Yap
submission: https://nightyap.com
repo: https://github.com/linuxserver/docker-chromium
support: https://discourse.linuxserver.io/
gallery: []
releaseNotes: >-
  First version.
dependencies: []
path: ""
defaultUsername: umbrel
deterministicPassword: true
